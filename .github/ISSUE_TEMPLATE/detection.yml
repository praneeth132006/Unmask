name: Wrong verdict (missed phishing or false alarm)
description: Unmask rated a phishing email as clean, or a legitimate email as risky
labels: [detection]
body:
  - type: markdown
    attributes:
      value: |
        These reports make Unmask better. **Remove personal data first**: replace your address with `you@example.com` and strip tracking tokens from links.
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      options:
        - Missed phishing (scored too low)
        - False alarm (legitimate email scored too high)
    validations:
      required: true
  - type: input
    id: score
    attributes:
      label: Score and verdict shown
      placeholder: "12, No red flags found"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What should Unmask have noticed (or ignored)?
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Anonymized sample (optional)
      description: The relevant headers or HTML, or attach a sanitized .eml. Never include real personal data.
      render: text
