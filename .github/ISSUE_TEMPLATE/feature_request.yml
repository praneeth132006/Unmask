name: Feature request
description: Suggest an idea for Unmask
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: privacy
    attributes:
      label: Privacy
      description: Unmask keeps email content on the device. Would this need to send anything anywhere?
