name: Benchmark

# Measures Unmask on real phishing (phishing_pot) and real legitimate email
# (SpamAssassin public corpus): the detection rate and the false-alarm rate.
# The corpora are downloaded here and never committed.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to measure and attach the result to (empty for the current branch)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  benchmark:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the corpora
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/benchmark
          key: benchmark-corpora-v1
      - name: Download the corpora
        run: node scripts/benchmark/fetch.mjs --phish 400
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Measure
        run: pnpm --filter unmask-extension exec vitest run tests/benchmark.test.ts
        env:
          UNMASK_BENCH_DIR: .cache/benchmark
          UNMASK_BENCH_OUT: .cache/benchmark/result
          # A release may not catch less or raise more false alarms than this.
          UNMASK_BENCH_MIN_CAUGHT_PCT: 85
          UNMASK_BENCH_MAX_FALSE_ALARM_PCT: 7
      - name: Summary
        if: always()
        run: |
          echo "## Unmask benchmark" >> "$GITHUB_STEP_SUMMARY"
          cat .cache/benchmark/result/benchmark.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No result." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: benchmark
          path: .cache/benchmark/result/
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" .cache/benchmark/result/benchmark.md .cache/benchmark/result/benchmark.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
