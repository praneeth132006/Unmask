name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check tag matches extension version
        run: |
          version=$(node -p "require('./extension/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension version $version" >&2
            exit 1
          fi
      - run: pnpm zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/unmask-chrome-*.zip \
            --title "Unmask $GITHUB_REF_NAME" \
            --notes "Download **unmask-chrome-${GITHUB_REF_NAME#v}.zip** below, unzip it, then open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and select the unzipped folder. See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed."
