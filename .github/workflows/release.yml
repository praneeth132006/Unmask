name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check tag matches extension version
        run: |
          version=$(node -p "require('./extension/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension version $version" >&2
            exit 1
          fi
      - run: pnpm zip:all
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" build/unmask-chrome-*.zip build/unmask-edge-*.zip build/unmask-firefox-*.zip build/unmask-extension-*-sources.zip \
            --title "Unmask $GITHUB_REF_NAME" \
            --notes "**Chrome / Brave:** download **unmask-chrome-$v.zip**, unzip it, open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and select the folder.
          **Edge:** same with **unmask-edge-$v.zip** at \`edge://extensions\`.
          **Firefox 128+:** download **unmask-firefox-$v.zip**, open \`about:debugging#/runtime/this-firefox\`, click **Load Temporary Add-on** and pick the zip.

          See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed."
