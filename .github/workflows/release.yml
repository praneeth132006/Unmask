name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    permissions:
      id-token: write      # Sigstore: sign the build provenance
      attestations: write  # store the provenance with the release files
      contents: write
      # To start the follow-up workflows below: a release made with this token doesn't trigger them by itself.
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check tag matches extension version
        run: |
          version=$(node -p "require('./extension/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension version $version" >&2
            exit 1
          fi
      - run: pnpm zip:all
      # Signed SLSA build provenance (Sigstore) for every file in the release:
      # anyone can check a download came from this workflow with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'build/unmask-*.zip'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" build/unmask-chrome-*.zip build/unmask-edge-*.zip build/unmask-firefox-*.zip build/unmask-extension-*-sources.zip \
            --title "Unmask $GITHUB_REF_NAME" \
            --notes "**Chrome / Brave:** download **unmask-chrome-$v.zip**, unzip it, open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and select the folder.
          **Edge:** same with **unmask-edge-$v.zip** at \`edge://extensions\`.
          **Firefox 128+:** download **unmask-firefox-$v.zip**, open \`about:debugging#/runtime/this-firefox\`, click **Load Temporary Add-on** and pick the zip.

          See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed."
      - name: Verify the release and attach the benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reproducible.yml --ref main -f tag="$GITHUB_REF_NAME"
          gh workflow run benchmark.yml --ref main -f tag="$GITHUB_REF_NAME"
