name: Wiki

on:
  push:
    branches: [main]
    paths: ['docs/**', 'site/wiki.mjs', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check out the wiki
        id: wiki
        run: |
          if git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "The wiki has no pages yet. Create the first page once on GitHub (Wiki tab), then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generate pages and push
        if: steps.wiki.outputs.ready == 'true'
        run: |
          node site/wiki.mjs wiki
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date"; exit 0; fi
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
