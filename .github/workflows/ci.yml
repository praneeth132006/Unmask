name: CI

on:
  # Every branch, so changes are proven green before main moves (see CONTRIBUTING).
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm build:firefox
      - run: pnpm build:edge
      - name: Install Chromium for end-to-end tests
        run: pnpm --filter unmask-extension exec playwright install --with-deps chromium
      - name: End-to-end tests (built extension in Chromium)
        run: pnpm test:e2e
      - name: End-to-end tests with in-page parsing blocked (offscreen fallback)
        run: pnpm --filter unmask-extension test:e2e:offscreen
