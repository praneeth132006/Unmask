name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Install Chromium for end-to-end tests
        run: pnpm --filter unmask-extension exec playwright install --with-deps chromium
      - name: End-to-end tests (built extension in Chromium)
        run: pnpm --filter unmask-extension test:e2e
