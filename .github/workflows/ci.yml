name: CI

on:
  # Every branch, so changes are proven green before main moves (see CONTRIBUTING).
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm build:firefox
      - run: pnpm build:edge
      - name: Install Chromium for end-to-end tests
        run: pnpm --filter unmask-extension exec playwright install --with-deps chromium
      - name: End-to-end tests (built extension in Chromium)
        run: pnpm test:e2e
      - name: End-to-end tests with in-page parsing blocked (offscreen fallback)
        run: pnpm --filter unmask-extension test:e2e:offscreen
