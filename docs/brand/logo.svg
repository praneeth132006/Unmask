<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Unmask">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Cuts a gap around the magnifier so the background shows through -->
    <mask id="gap">
      <rect width="128" height="128" fill="#FFFFFF"/>
      <circle cx="88" cy="84" r="27" fill="#000000"/>
      <line x1="101" y1="97" x2="113" y2="109" stroke="#000000" stroke-width="20" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <g mask="url(#gap)">
    <rect x="16" y="30" width="78" height="58" rx="10" fill="#FFFFFF"/>
    <path d="M24 39 L55 62 L86 39" fill="none" stroke="#6D5AF0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="88" cy="84" r="17" fill="#312E81" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="101" y1="97" x2="112" y2="108" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <circle cx="88" cy="84" r="5.5" fill="#FBBF24"/>
</svg>
